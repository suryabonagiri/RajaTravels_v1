spring.application.name=rajatravels

# File-based H2 database (zero setup). Swap these four properties to use MySQL/Postgres in production.
spring.datasource.url=jdbc:h2:file:./data/rajatravels;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
